[workspace]
resolver = "2"
members = [
    "crates/terminalui-core",
    "crates/terminalui",
    "crates/terminalui-components",
    "crates/terminalui-animations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Jean Vides <contact@jeanvides.com>"]
repository = "https://github.com/JeanVydes/terminalui"
documentation = "https://github.com/JeanVydes/terminalui"
keywords = ["tui", "ratatui", "components", "terminal", "ui"]
categories = ["command-line-interface"]

[workspace.dependencies]
terminalui-core = { version = "0.1.0", path = "crates/terminalui-core" }
terminalui-animations = { version = "0.1.0", path = "crates/terminalui-animations" }
terminalui-components = { version = "0.1.0", path = "crates/terminalui-components" }
